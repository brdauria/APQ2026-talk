<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 20 820 455" width="820" height="410">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#222"/></marker>
    <style>
      .axis{stroke:#222;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .level{stroke:#667085;stroke-width:1.8;stroke-dasharray:7 7}
      .path{stroke:#111;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .jump{stroke:#111;stroke-width:3.2;fill:none}
      .guide{stroke:#cc2b2b;stroke-width:1.5;stroke-dasharray:5 5;opacity:.7}
      .hit{fill:#cc2b2b;stroke:white;stroke-width:2}.hit-ring{fill:none;stroke:#cc2b2b;stroke-width:2;opacity:.65}
      .label{font-family:"Times New Roman",Georgia,serif;font-size:28px;fill:#111}.small{font-size:21px}
      .math{font-family:"Times New Roman",Georgia,serif;font-style:italic;fill:#111}.mathrm{font-family:"Times New Roman",Georgia,serif;font-style:normal;fill:#111}
      .sub{baseline-shift:sub;font-size:65%;letter-spacing:-.04em}.sup{baseline-shift:super;font-size:65%;letter-spacing:-.04em}
    </style>
  </defs>
  <line x1="110" y1="430" x2="835" y2="430" class="axis"/><line x1="110" y1="430" x2="110" y2="70" class="axis"/>
  <line x1="110" y1="140" x2="800" y2="140" class="level"/><line x1="110" y1="285" x2="800" y2="285" class="level"/>
  <!-- AIMD path: affine increase between jump epochs; vertical multiplicative decreases -->
  <path class="path" d="M110 430 L220 330"/><path class="jump" d="M220 330 L220 378"/>
  <path class="path" d="M220 378 L365 285 L445 235"/><path class="jump" d="M445 235 L445 330"/>
  <path class="path" d="M445 330 L600 215"/><path class="jump" d="M600 215 L600 295"/>
  <path class="path" d="M600 295 L792 140"/>
  <line x1="365" y1="285" x2="365" y2="430" class="guide"/><line x1="792" y1="140" x2="792" y2="430" class="guide"/>
  <circle cx="365" cy="285" r="8" class="hit"/><circle cx="365" cy="285" r="15" class="hit-ring"/>
  <circle cx="792" cy="140" r="8" class="hit"/><circle cx="792" cy="140" r="15" class="hit-ring"/>
  <text x="84" y="438" class="label small">0</text><text x="84" y="147" class="label"><tspan class="math">a</tspan></text><text x="84" y="292" class="label"><tspan class="math">x</tspan></text>
  <text x="822" y="458" class="label"><tspan class="math">t</tspan></text><text x="72" y="82" class="label"><tspan class="math">X</tspan><tspan class="math sub" dx="0">t</tspan></text>
  <text x="356" y="450" class="label"><tspan class="math">τ</tspan><tspan class="math sub" dx="-2">↑x</tspan></text>
  <text x="783" y="450" class="label"><tspan class="math">τ</tspan><tspan class="math sub" dx="-2">↑a</tspan></text>
  <text x="205" y="276" class="label small"><tspan class="math">Z</tspan><tspan class="mathrm">(0 ↑ </tspan><tspan class="math">x</tspan><tspan class="mathrm">)</tspan></text>
  <text x="610" y="168" class="label small"><tspan class="math">Z</tspan><tspan class="mathrm">(</tspan><tspan class="math">x ↑ a</tspan><tspan class="mathrm">)</tspan></text>
  <text x="305" y="50" class="label small">
    <tspan class="math">τ</tspan><tspan class="sub">↑a</tspan><tspan class="mathrm">(0,J(0)) ≍ </tspan>
    <tspan class="math">τ</tspan><tspan class="sub">↑x</tspan><tspan class="mathrm">(0,J(0)) + </tspan>
    <tspan class="math">τ</tspan><tspan class="sub">↑a</tspan><tspan class="mathrm">(x, J(τ</tspan><tspan class="sub">↑x</tspan><tspan class="mathrm">))</tspan>
  </text>
</svg>