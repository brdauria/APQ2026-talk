<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#17324d"/>
    </marker>
    <marker id="jumpArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b42318"/>
    </marker>
    <style>
      .panel{fill:#fff;stroke:#d0d5dd;stroke-width:2;rx:16}
      .band{fill:#eef4ff;stroke:none}
      .axis{stroke:#344054;stroke-width:2}
      .level{stroke:#667085;stroke-width:2;stroke-dasharray:8 7}
      .oldlevel{stroke:#175cd3;stroke-width:3}
      .path{stroke:#175cd3;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .jump{stroke:#b42318;stroke-width:4;fill:none;marker-end:url(#jumpArrow)}
      .continuation{stroke:#039855;stroke-width:4;fill:none;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .title{font:700 25px Arial,sans-serif;fill:#101828}
      .label{font:22px Arial,sans-serif;fill:#344054}
      .math{font:italic 23px Georgia,serif;fill:#101828}
      .note{font:19px Arial,sans-serif;fill:#475467}
      .known{font:700 18px Arial,sans-serif;fill:#027a48}
      .hit{fill:#175cd3}
    </style>
  </defs>
  <rect x="20" y="20" width="940" height="660" rx="22" fill="#fff" stroke="#eaecf0" stroke-width="2"/>
  <text x="490" y="58" text-anchor="middle" class="title">Recursive continuation from a to a / p̄</text>
  <text x="490" y="88" text-anchor="middle" class="note">p̄ = maxᵢ pᵢ; every jump before the new upper level lands below a</text>

  <g transform="translate(55,120)">
    <rect class="panel" x="0" y="0" width="410" height="500"/>
    <text x="205" y="38" text-anchor="middle" class="title">No jump first</text>
    <rect class="band" x="68" y="95" width="285" height="150" rx="10"/>
    <line class="axis" x1="70" y1="420" x2="350" y2="420"/>
    <line class="level" x1="70" y1="105" x2="350" y2="105"/>
    <line class="oldlevel" x1="70" y1="245" x2="350" y2="245"/>
    <line class="level" x1="70" y1="365" x2="350" y2="365"/>
    <text x="25" y="112" class="math">a / p̄</text>
    <text x="43" y="252" class="math">a</text>
    <text x="43" y="372" class="math">b</text>
    <path class="path" d="M95 245 L295 105"/>
    <circle class="hit" cx="295" cy="105" r="7"/>
    <text x="205" y="458" text-anchor="middle" class="note">continuous climb reaches a / p̄</text>
    <text x="205" y="486" text-anchor="middle" class="math">exp{−zᵢ(a/p̄−x)} δᵢⱼ</text>
  </g>

  <g transform="translate(515,120)">
    <rect class="panel" x="0" y="0" width="410" height="500"/>
    <text x="205" y="38" text-anchor="middle" class="title">A jump occurs first</text>
    <rect class="band" x="68" y="95" width="285" height="150" rx="10"/>
    <line class="axis" x1="70" y1="420" x2="350" y2="420"/>
    <line class="level" x1="70" y1="105" x2="350" y2="105"/>
    <line class="oldlevel" x1="70" y1="245" x2="350" y2="245"/>
    <line class="level" x1="70" y1="365" x2="350" y2="365"/>
    <text x="25" y="112" class="math">a / p̄</text>
    <text x="43" y="252" class="math">a</text>
    <text x="43" y="372" class="math">b</text>
    <path class="path" d="M95 245 L205 165"/>
    <path class="jump" d="M205 165 L205 300"/>
    <circle cx="205" cy="300" r="7" fill="#b42318"/>
    <path class="continuation" d="M205 300 C250 285 285 265 320 245"/>
    <text x="220" y="326" class="math">y = pᵢ(x+t/cᵢ) &lt; a</text>
    <text x="205" y="458" text-anchor="middle" class="known">use the known two-sided transform below a</text>
    <text x="205" y="486" text-anchor="middle" class="note">then concatenate at level a by the cocycle property</text>
  </g>

  <text x="490" y="654" text-anchor="middle" class="note">This is the first-step mechanism behind P(x) and (I − P(a))⁻¹.</text>
</svg>